name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the personal-data guard checks every commit, not just the tip

      # setup-uv publishes no floating major tag (v10), only full versions.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # The build tests skip without ffmpeg; install it so they run.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      # This repo is public: fail if any commit adds personal data, even one a later commit deletes.
      - name: No personal data
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          revs=HEAD
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            revs="$revs $(git rev-list "$BASE..$HEAD_SHA")"
          fi
          uv run scripts/check_public.py $revs

      - name: Validate data
        shell: bash
        run: |
          set +e
          uv run scripts/validate.py > validate.txt 2>&1
          status=$?
          set -e
          cat validate.txt

          # Warnings never fail the run, so surface them where a reviewer will see them.
          grep '^warning: ' validate.txt | sed 's/^warning: //' > warnings.txt || true
          while IFS= read -r w; do echo "::warning title=validator::$w"; done < warnings.txt

          {
            echo "## Validator"
            if [ "$status" -ne 0 ]; then
              echo "**Failed:** broken references."
              echo '```'
              sed -n '/^ERRORS:/,$p' validate.txt
              echo '```'
            else
              echo "OK: no broken references."
            fi
            echo
            echo "### Warnings ($(wc -l < warnings.txt | tr -d ' '))"
            sed 's/^/- /' warnings.txt
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```'
            cat validate.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      # Tests use the silent TTS engine, so no credentials are needed.
      - name: Run tests
        run: uv run pytest
