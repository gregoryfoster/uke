[project]
name = "uke"
version = "0.1.0"
description = "Aikido terminology study tool: Anki deck and commute audio generated from data/"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "genanki>=0.13",
    # TTS engines: google is the default; edge is an optional free alternative
    "google-cloud-texttospeech>=2.16",
    "edge-tts>=7",
]

[project.scripts]
uke = "uke.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
